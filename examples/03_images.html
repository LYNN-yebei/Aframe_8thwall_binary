<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>03 — Images, Video, and Audio (with Debugging)</title>

  <!-- AR Libraries -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- 8th Wall Engine -->
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <!-- This component controls media playback when the image target is found or lost. -->
  <script>
    AFRAME.registerComponent('media-control-on-scan', {
      schema: {
        video: {type: 'selector'},
        audio: {type: 'selector'},
      },
      init: function () {
        this.video = this.data.video;
        this.audio = this.data.audio;

        // Ensure media is paused initially.
        if (this.video) this.video.pause();
        if (this.audio) this.audio.pause();

        this.onFound = () => {
          // This is the fix: Reset media to the beginning before playing.
          // This creates a reliable "restart" instead of a fragile "resume".
          if (this.video) this.video.currentTime = 0;
          if (this.audio) this.audio.currentTime = 0;

          if (this.video) this.video.play();
          if (this.audio) this.audio.play();
        };
        
        this.onLost = () => {
          if (this.video) this.video.pause();
          if (this.audio) this.audio.pause();
        };

        // Listen for scene events.
        this.el.sceneEl.addEventListener('xrimagefound', this.onFound);
        this.el.sceneEl.addEventListener('xrimagelost', this.onLost);
      },
      remove: function () {
        // Clean up on removal.
        if (this.video) this.video.pause();
        if (this.audio) this.audio.pause();
        this.el.sceneEl.removeEventListener('xrimagefound', this.onFound);
        this.el.sceneEl.removeEventListener('xrimagelost', this.onLost);
      },
    });
  </script>
  
  <!-- Image Target Configuration -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData:[{
          "name": "my-poster",
          "type": "PLANAR",
          // Make sure this path is correct relative to your HTML file.
          "imagePath": "../assets/Targets/Final/Saturn.png",
          "properties": {
            "left": 0, "top": 0,
            "width": 830, "height": 830,
            "originalWidth": 830, "originalHeight": 830,
            "isRotated": false
          }
        }]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>
</head>

<body>
  <a-scene
    <!-- THIS IS THE NEW DEBUGGING TOOL. Look for a gear icon on your phone! -->
    xrextras-debug-console
    
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <!-- Preload all assets. If paths are wrong, you will see errors in the debug console. -->
    <a-assets>
      <!-- Make sure all these ../assets/ paths are correct! -->
      <img id="frontview" src="../assets/Targets/Final/burger1.png" crossorigin="anonymous">
      <img id="background" src="../assets/Targets/Final/Background1.png" crossorigin="anonymous">
      
      <video id="main-video" src="../assets/Targets/Final/Video-1.mp4" loop muted playsinline crossorigin="anonymous"></video>
      
      <audio id="background-sound" src="../assets/634332__josefpres__bass-loops-077-with-drums-long-loop-120-bpm.mp3" loop preload="auto" crossorigin="anonymous"></audio>
    </a-assets>

    <a-camera position="0 4 10"></a-camera>

    <!-- Apply the component and link it to the video and audio assets. -->
    <xrextras-named-image-target name="my-poster" media-control-on-scan="video: #main-video; audio: #background-sound">

      <!-- Instance 1 — back layer -->
      <a-image src="#background" position="0 0.3 0" width="1.5" height="3"></a-image>

      <!-- Instance 2 — middle layer -->
      <a-video src="#main-video" position="0 0.3 0.3" width="1.5" height="3"></a-video>

      <!-- Instance 3 — front layer -->
      <a-image src="#frontview" position="0 0.3 0.6" width="1.5" height="3"></a-image>

    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
