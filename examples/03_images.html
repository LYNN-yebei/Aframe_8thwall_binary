<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>03 — Images, Video, and Audio</title>

  <!-- AR Libraries -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- 8th Wall Engine -->
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <!-- Component to play/pause media on image target detection -->
  <script>
    // This new component can control both a video and an audio element.
    AFRAME.registerComponent('media-control-on-scan', {
      schema: {
        video: {type: 'selector'},
        audio: {type: 'selector'},
      },
      init: function () {
        this.video = this.data.video;
        this.audio = this.data.audio;

        // Pause media initially.
        if (this.video) this.video.pause();
        if (this.audio) this.audio.pause();

        // Define functions to be called on find/loss.
        this.onFound = () => {
          if (this.video) this.video.play();
          if (this.audio) this.audio.play();
        };
        this.onLost = () => {
          if (this.video) this.video.pause();
          if (this.audio) this.audio.pause();
        };

        // Listen for events on the scene.
        this.el.sceneEl.addEventListener('xrimagefound', this.onFound);
        this.el.sceneEl.addEventListener('xrimagelost', this.onLost);
      },
      remove: function () {
        // Clean up event listeners when the component is removed.
        if (this.video) this.video.pause();
        if (this.audio) this.audio.pause();
        this.el.sceneEl.removeEventListener('xrimagefound', this.onFound);
        this.el.sceneEl.removeEventListener('xrimagelost', this.onLost);
      },
    });
  </script>
  
  <!-- Image Target Configuration -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData:[{
          "name": "my-poster",
          "type": "PLANAR",
          "imagePath": "../assets/Targets/Final/Saturn.png",
          "properties": {
            "left": 0, "top": 0,
            "width": 830, "height": 830,
            "originalWidth": 830, "originalHeight": 830,
            "isRotated": false
          }
        }]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>

  <!-- Chromakey Shader -->
  <script>
    AFRAME.registerShader('chromakey', {
      schema: {
        src: {type: 'map'},
        color: {type: 'color', default: '#00FF00'},
        chroma: {type: 'bool', default: true},
        transparent: {default: true}
      },

      init: function (data) {
        const videoEl = data.src;
        if (!videoEl) { return; }

        var videoTexture = new THREE.VideoTexture(videoEl);
        videoTexture.minFilter = THREE.LinearFilter;
        this.material = new THREE.ShaderMaterial({
          transparent: data.transparent,
          uniforms: {
            chroma: { type: 'b', value: data.chroma },
            color: { type: 'c', value: new THREE.Color(data.color) },
            myTexture: { type: 't', value: videoTexture }
          },
          vertexShader: this.vertexShader,
          fragmentShader: this.fragmentShader
        });
      },

      update: function (data) {
        this.material.uniforms.chroma.value = data.chroma;
        this.material.uniforms.color.value.set(data.color);
        this.material.transparent = data.transparent;
      },

      vertexShader: [
        'varying vec2 vUv;',
        'void main(void) {',
        '  vUv = uv;',
        '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
        '}'
      ].join('\n'),

      fragmentShader: [
        'uniform sampler2D myTexture;',
        'uniform vec3 color;',
        'uniform bool chroma;',
        'varying vec2 vUv;',
        'void main(void) {',
        '  vec3 tColor = texture2D(myTexture, vUv).rgb;',
        '  float a = 1.0;',
        '  if (chroma) {',
        '    a = (length(tColor - color) - 0.6) * 7.0;',
        '  }',
        '  gl_FragColor = vec4(tColor, a);',
        '}'
      ].join('\n')
    });
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <!-- Preload all assets -->
    <a-assets>
      <img id="frontview" src="../assets/Targets/Final/frontview.png" crossorigin="anonymous">
      <img id="background" src="../assets/Targets/Final/background.png" crossorigin="anonymous">
      <img id="cloud" src="../assets/Targets/Final/cloud.png" crossorigin="anonymous">
      
      <!-- IMPORTANT: Make sure your video is compressed for mobile! -->
      <!-- I removed 'autoplay' because the component now controls playback. -->
      <video id="main-video" src="../assets/Targets/Final/video.mp4" loop muted playsinline crossorigin="anonymous"></video>
      
      <!-- 1. Add your audio file here. Replace the src with your audio file path. -->
      <audio id="background-sound" src="../assets/Targets/Final/Audio.mp3" loop preload="auto" crossorigin="anonymous"></audio>
    </a-assets>

    <a-camera position="0 4 10"></a-camera>

    <!-- 2. Apply the new component and link it to BOTH video and audio assets -->
    <xrextras-named-image-target name="my-poster" media-control-on-scan="video: #main-video; audio: #background-sound">

      <!-- Instance 1 — back layer -->
      <a-image src="#background" position="0 0.3 0" width="1.5" height="3"></a-image>

      <!-- Instance 2 — middle layer -->
      <a-entity
        geometry="primitive: plane; width: 1; height: 1.5"
        material="shader: chromakey; src: #main-video; chroma: true; color: #00FF33;"
        position="0 0.3 0.4">
      </a-entity>

      <!-- Instance 3 — cloud layer -->
      <a-image src="#cloud" position="0.2 0.3 0.6" width="1.5" height="3"></a-image>

      <!-- Instance 3 — front layer -->
      <a-image src="#frontview" position="0 0.5 0.7" width="1.7" height="3.4"></a-image>

    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
